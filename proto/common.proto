syntax = "proto3";

package proto;
option go_package = "future_was/pb";

import "item.proto";

message ErrorResponse {
  int32 code = 1;
  string message = 2;
}

message HealthResponse {
  string status = 1;
}

message WelcomeResponse {
  string message = 1;
}

message GameRequest {
  uint32 action = 1;
  uint64 user_id = 2;
  int64 timestamp = 3;
  string client_version = 4;
  string session_token = 5;
  bytes body = 6;
}

message GameResponse {
  uint32 action = 1;
  int32 code = 2;
  int64 timestamp = 3;
  bytes body = 4;
  SyncData sync = 5;
}

// SyncData 이번 요청에서 서버 측에서 변경된(생성/수정) 엔티티 모음.
// dispatch가 UoW의 dirty 추적을 통해 자동으로 채운다.
// 새 도메인 추가 시 한 줄 추가 + 해당 도메인 setup에서 RegisterSyncBuilder 호출.
message SyncData {
  repeated ItemData items = 1;
}
